[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefforge"
version = "0.1.0"
description = "Evidence-led multi-agent industry research and editable office reports"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=2,<4", "langgraph-checkpoint-postgres>=2,<4",
  "aiosqlite>=0.20,<1", "python-multipart>=0.0.20", "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4", "pypdf>=5,<7", "beautifulsoup4>=4.12,<5",
  "matplotlib>=3.9,<4", "pillow>=11,<13"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pytest-cov>=6,<8"]
[project.scripts]
briefforge = "briefforge.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
briefforge = ["export_support/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 110

